name: Test personalizzazione CV

on:
  workflow_dispatch:  # avvio manuale dalla UI GitHub, per verificare la pipeline di personalizzazione CV

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Genera un CV personalizzato di test (.docx)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python - <<'EOF'
          import cv_personalizzazione as cp

          annuncio_test = """
          Digital Sales Manager - Scaleup SaaS B2B

          Cerchiamo un Digital Sales Manager per guidare la crescita commerciale della nostra
          piattaforma SaaS B2B in fase di scale-up.

          Cosa cerchiamo:
          - Esperienza comprovata nella costruzione di processi commerciali strutturati (pipeline, CRM)
          - Gestione di persone e team cross-funzionali
          - Esperienza in ambiente start-up/scale-up ad alta crescita
          - Conoscenza di Salesforce (requisito preferenziale)
          - Ownership su obiettivi di revenue e crescita clienti
          """

          risultato = cp.genera_cv_personalizzato("Digital Sales Manager", annuncio_test, job_city="Torino", output_dir="test_output")
          if risultato is None:
              raise SystemExit("Generazione fallita: controlla i log sopra (LLM o template mancante).")

          print("Generato con successo:")
          print("  DOCX:", risultato["docx_path"])
          print("  Riepilogo modifiche:")
          for riga in risultato["riepilogo"]:
              print("   -", riga)
          EOF

      - name: Carica il .docx generato come artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-personalizzato-test
          path: test_output/
          retention-days: 7
