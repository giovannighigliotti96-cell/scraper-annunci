name: Keep-Alive GitHub Actions

on:
  schedule:
    # Esegue una volta a settimana per mantenere attivi i cron del repository
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  cronjob_automator:
    runs-on: ubuntu-latest
    # Tetto di sicurezza: senza, un run bloccato arriva al limite di 6 ore
    # di GitHub e brucia minuti per nulla (05/10/2026: la diagnostica e'
    # rimasta ferma 6 ore su una chiamata che non rispondeva).
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
