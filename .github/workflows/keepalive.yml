name: Keep-Alive GitHub Actions

on:
  schedule:
    # Esegue una volta a settimana per mantenere attivi i cron del repository
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  cronjob_automator:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
