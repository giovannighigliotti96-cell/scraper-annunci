name: Invio email giornaliera

on:
  schedule:
    - cron: '5 16 * * *'   # 18:05 CEST (UTC+2 estate, fuori picco)
  workflow_dispatch:       # avvio manuale dalla UI GitHub

permissions:
  contents: write

jobs:
  send_email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Verifica/installa LibreOffice (per personalizzazione CV >=80% match)
        run: |
          if ! command -v soffice &> /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends libreoffice-writer
          else
            echo "LibreOffice già presente nel runner, salto l'installazione"
          fi

      - name: Installa i font del CV (per la conversione docx->pdf fedele)
        run: |
          mkdir -p ~/.local/share/fonts
          cp fonts/*.ttf ~/.local/share/fonts/
          fc-cache -f ~/.local/share/fonts

      - name: Invia email e svuota accumulo giornaliero
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DESTINATION_EMAIL: ${{ secrets.DESTINATION_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python run_email_job.py

      - name: Salva stato post-email
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add offerte_giornaliere.json
          git diff --staged --quiet || git commit -m "chore: svuota giornaliere post-email [skip ci]"
          git push
