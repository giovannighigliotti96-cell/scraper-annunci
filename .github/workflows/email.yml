name: Invio email giornaliera

on:
  schedule:
    # GitHub Actions cron è sempre in UTC, ma l'Italia alterna CEST (UTC+2, marzo-ottobre)
    # e CET (UTC+1, ottobre-marzo). Due cron entry (una per stagione): lo step
    # "Verifica orario" più sotto esegue l'invio solo se l'ora locale italiana reale
    # corrisponde alle 18:05, così esattamente una delle due invocazioni gira per
    # davvero in ciascuna stagione.
    - cron: '5 16 * * *'   # 18:05 CEST (UTC+2, estate)
    - cron: '5 17 * * *'   # 18:05 CET (UTC+1, inverno)
  workflow_dispatch:       # avvio manuale dalla UI GitHub

concurrency:
  group: email
  cancel-in-progress: false  # in coda, mai cancellare un invio già in corso né farne partire due in parallelo

permissions:
  contents: write

jobs:
  send_email:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica orario italiano (gestisce cambio ora legale/solare)
        id: check_time
        run: |
          ORA_ITALIA=$(TZ='Europe/Rome' date +%H:%M)
          echo "Ora locale Italia: $ORA_ITALIA"
          SHOULD_RUN=false
          ORA_SEC=$(date -d "$ORA_ITALIA" +%s)
          TARGET_SEC=$(date -d "17:50" +%s)
          # Finestra aperta fino a fine giornata (23:55), non più 2h fisse: verificato
          # dal vivo che il 17/07, PRIMA di questo fix, il cron nativo delle 18:05 è
          # arrivato in ritardo DUE volte (19:16 e 20:08) — la seconda già fuori dalla
          # finestra di 2h introdotta lo stesso giorno — ed entrambe le volte
          # should_run è risultato false. L'unica email di ieri è partita solo grazie
          # al workflow_dispatch di backup del repo esterno scraper-scheduler: il cron
          # nativo era di fatto già inutilizzabile appena un'ora dopo aver allargato
          # la finestra a 2h. Dato che il prossimo target è il giorno successivo, non
          # c'è rischio di sovrapposizione ad allargare fino a fine giornata: qualunque
          # ritardo di GitHub Actions entro la mezzanotte fa comunque scattare l'invio.
          TARGET_END_SEC=$(date -d "23:55" +%s)
          if [ "$ORA_SEC" -ge "$TARGET_SEC" ] && [ "$ORA_SEC" -lt "$TARGET_END_SEC" ]; then
            SHOULD_RUN=true
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHOULD_RUN=true
          fi
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "Esecuzione invio email: $SHOULD_RUN"

      - name: Checkout repo
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installa dipendenze
        if: steps.check_time.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Backup pre-invio (per il merge post-email)
        if: steps.check_time.outputs.should_run == 'true'
        run: |
          # Cattura lo stato di offerte_giornaliere.json PRIMA dell'invio: sono
          # esattamente le offerte che questa run sta per inviare/svuotare. Serve
          # per il merge dopo il reset allo stato remoto più recente più sotto.
          cp offerte_giornaliere.json /tmp/before_email.json 2>/dev/null || echo '[]' > /tmp/before_email.json

      - name: Invia email e svuota accumulo giornaliero
        if: steps.check_time.outputs.should_run == 'true'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DESTINATION_EMAIL: ${{ secrets.DESTINATION_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python run_email_job.py

      - name: Salva stato post-email
        # Questo step gira solo se lo step precedente è andato a buon fine (comportamento
        # di default di GitHub Actions): se l'invio fallisce, run_email_job.py NON svuota
        # né offerte_giornaliere.json né daily_prospects.json (vedi invia_email_job/invia_email
        # in scraper.py), quindi non c'è nulla da salvare — il prossimo invio pianificato
        # ritenterà automaticamente con le stesse offerte, senza bisogno di un file "pending"
        # separato (che sarebbe comunque inutilizzabile: gitignored, runner effimero).
        if: steps.check_time.outputs.should_run == 'true'
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          # Backup dello stato locale POST-invio (già corretto: run_email_job.py ha
          # svuotato daily_prospects.json solo se conteneva prospect e l'invio è
          # riuscito) prima che git reset --hard lo sovrascriva con la versione remota.
          cp daily_prospects.json /tmp/prospects_after_run.json 2>/dev/null || echo '[]' > /tmp/prospects_after_run.json

          for i in 1 2 3; do
            # Aggiorna al commit più recente del remoto (uno scraping concorrente
            # potrebbe aver pushato nuove offerte mentre l'email era in invio).
            git fetch origin main
            git reset --hard origin/main

            # Merge intelligente: rimuove SOLO le offerte che questa run ha appena
            # inviato via email (catturate nel backup pre-invio), preservando
            # eventuali offerte arrivate nel frattempo da uno scraping concorrente
            # (non ancora inviate, non vanno perse). load() distingue "file assente"
            # da "file presente ma illeggibile" (errore fatale, non un default
            # silenzioso), e la scrittura è atomica (temp file + rename).
            python3 - <<'EOF'
          # load()/atomic_write_json() vivono in state_io.py (nel checkout, zero
          # dipendenze esterne): stessa implementazione usata da scraper.py e da
          # scraping.yml, invece di duplicarla qui in un heredoc che può divergere
          # silenziosamente (è già successo: le due copie precedenti avevano firme
          # leggermente diverse).
          from state_io import load_json_or_raise as load, atomic_write_json

          inviate = load('/tmp/before_email.json', [])
          # Solo link non vuoti: un record senza link (None/"") non deve entrare nel
          # set, altrimenti un'offerta arrivata nel frattempo da uno scraping
          # concorrente con link altrettanto vuoto/mancante verrebbe rimossa per
          # errore, anche se non è mai stata inviata.
          link_inviati = {j.get('link') for j in inviate if j.get('link')}

          remote_gior = load('offerte_giornaliere.json', [])
          rimanenti = [j for j in remote_gior if j.get('link') not in link_inviati]
          atomic_write_json('offerte_giornaliere.json', rimanenti, ensure_ascii=False, indent=2)

          # daily_prospects.json non è toccato da alcun processo concorrente (il
          # modulo prospector è disattivato): si ripristina la verità locale calcolata
          # da invia_email() dopo l'invio, che git reset --hard avrebbe altrimenti
          # sovrascritto con la versione remota pre-invio.
          prospects_locali = load('/tmp/prospects_after_run.json', [])
          atomic_write_json('daily_prospects.json', prospects_locali, ensure_ascii=False, indent=2)

          print(f"Merge OK: rimosse {len(link_inviati)} offerte inviate, {len(rimanenti)} rimaste (arrivate nel frattempo)")
          EOF

            git add offerte_giornaliere.json daily_prospects.json
            if git diff --staged --quiet; then
              echo "Nessuna modifica da salvare."
              exit 0
            fi
            git commit -m "chore: svuota giornaliere post-email [skip ci]"
            if git push; then
              echo "Push riuscito al tentativo $i."
              exit 0
            fi
            echo "Push rifiutato (probabile push concorrente), tentativo $i/3: riprovo il merge..."
          done
          echo "Push fallito dopo 3 tentativi." >&2
          exit 1
