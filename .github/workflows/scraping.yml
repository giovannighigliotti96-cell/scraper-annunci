name: Scraping offerte

on:
  schedule:
    # GitHub Actions cron è sempre in UTC, ma l'Italia alterna CEST (UTC+2, marzo-ottobre)
    # e CET (UTC+1, ottobre-marzo). Per ogni orario italiano target ci sono quindi DUE
    # cron entry (una per stagione): lo step "Verifica orario" più sotto controlla l'ora
    # locale italiana reale ed esegue lo scraping solo se corrisponde a un orario target,
    # così esattamente una delle due invocazioni gira per davvero in ciascuna stagione.
    # RETE DI SICUREZZA, non il meccanismo principale: gli scraping puntuali li
    # innesca cron-job.org via workflow_dispatch. Il cron di GitHub slitta di
    # 1-4.6 ore (misurato), il che vanificherebbe l'alert immediato — il cui
    # senso e' proprio candidarsi lo stesso giorno.
    # Queste entry coprono il caso in cui il trigger esterno non arrivi; il guard
    # sulla distanza minima piu' sotto evita che ripetano un run gia' fatto.
    - cron: '17 9 * * *'
    - cron: '17 13 * * *'
  workflow_dispatch:        # avvio manuale dalla UI GitHub

concurrency:
  group: scraping
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica orario italiano (gestisce cambio ora legale/solare)
        id: check_time
        run: |
          ORA_ITALIA=$(TZ='Europe/Rome' date +%H:%M)
          echo "Ora locale Italia: $ORA_ITALIA"
          ORA_SEC=$(date -d "$ORA_ITALIA" +%s)
          # Finestra UNICA e continua (09:17-19:30), non più 4 finestre separate di
          # 2h attorno a ciascun target: quelle lasciavano dei "buchi" scoperti tra
          # una finestra e l'altra (11:17-12:17, 14:17-15:17, 17:17-17:30) — osservato
          # dal vivo il 18/07 un run reale caduto proprio in uno di questi buchi
          # (11:47, should_run=false) nonostante il fix precedente. GitHub Actions
          # su repository a basso traffico ritarda i cron anche di 1-2h+ in modo
          # imprevedibile, quindi qualunque partizione fissa rischia di avere un
          # buco che un ritardo reale può colpire. Una finestra unica sull'intero
          # orario lavorativo (09:17-19:30) non ha buchi per costruzione: una delle
          # 8 cron entry (4 target x 2 stagioni) che ricade, comunque ritardata,
          # nell'orario locale italiano di questa fascia fa sempre scattare lo
          # scraping — il dedup su viste rende innocuo un eventuale run ravvicinato.
          INIZIO_SEC=$(date -d "09:17" +%s)
          FINE_SEC=$(date -d "06:00" +%s)
          if [ "$ORA_SEC" -ge "$INIZIO_SEC" ] || [ "$ORA_SEC" -lt "$FINE_SEC" ]; then
            SHOULD_RUN=true
          else
            SHOULD_RUN=false
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHOULD_RUN=true
          fi
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "Esecuzione scraping: $SHOULD_RUN"

      - name: Checkout repo
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Serve un po' di storia allo step successivo: con il fetch-depth 1 di
          # default, `git log --grep` vedrebbe solo l'ultimo commit e non
          # troverebbe quello dell'ultimo scraping se in mezzo c'e' un push.
          fetch-depth: 30

      - name: Verifica distanza dall'ultimo scraping
        id: check_gap
        # Deve stare DOPO il checkout: legge la storia git, che prima non esiste.
        # Le cron entry sono molte per prendere il primo slot che GitHub concede,
        # ma senza questo controllo un ritardo che ne facesse partire diverse
        # ravvicinate produrrebbe run inutili — il dedup li rende innocui, non
        # gratuiti: ognuno dura ~25 minuti e consuma quota Gemini. Si guarda
        # l'orario dell'ultimo commit di stato, che ogni run produce.
        if: steps.check_time.outputs.should_run == 'true'
        run: |
          ABBASTANZA_TEMPO=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ULTIMO=$(git log -1 --format=%ct --grep="aggiorna stato scraper" || echo 0)
            ADESSO=$(date +%s)
            if [ "$ULTIMO" -gt 0 ] && [ $((ADESSO - ULTIMO)) -lt 5400 ]; then
              echo "Ultimo scraping $(( (ADESSO - ULTIMO) / 60 )) minuti fa: salto, e' troppo ravvicinato."
              ABBASTANZA_TEMPO=false
            fi
          fi
          echo "ok=$ABBASTANZA_TEMPO" >> "$GITHUB_OUTPUT"
          echo "Procedo: $ABBASTANZA_TEMPO"

      - name: Setup Python
        if: steps.check_time.outputs.should_run == 'true' && steps.check_gap.outputs.ok == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installa dipendenze
        if: steps.check_time.outputs.should_run == 'true' && steps.check_gap.outputs.ok == 'true'
        run: pip install -r requirements.txt

      - name: Esegui scraping
        if: steps.check_time.outputs.should_run == 'true' && steps.check_gap.outputs.ok == 'true'
        env:
          # Le credenziali Gmail servono ANCHE qui: dal 09/09 run_manual_scrape.py
          # manda un alert immediato per le offerte sopra la soglia alta, invece
          # di farle aspettare il riepilogo delle 18:05 (vedi invia_alert_immediato).
          # Il riepilogo giornaliero resta compito di run_email_job.py in email.yml.
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DESTINATION_EMAIL: ${{ secrets.DESTINATION_EMAIL }}
          # Le chiavi dei modelli servono per la valutazione semantica delle
          # offerte superstiti: si prova prima Claude e, se non disponibile
          # (tipicamente credito esaurito), si ricade su Gemini.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python run_manual_scrape.py

      - name: Salva memoria (commit JSON)
        if: steps.check_time.outputs.should_run == 'true' && steps.check_gap.outputs.ok == 'true'
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          # Backup dei JSON prodotti da questo run. Per le offerte si usa il delta
          # nuove_offerte_run.json (solo quelle trovate in QUESTO run), non l'intero
          # offerte_giornaliere.json locale: quest'ultimo include anche offerte già
          # presenti prima del run, che un email.yml concorrente potrebbe aver già
          # rimosso dal remoto perché inviate — usarlo qui le "resusciterebbe".
          cp offerte_viste.json /tmp/run_viste.json
          cp nuove_offerte_run.json /tmp/run_gior.json
          # Salute portali: stato locale appena calcolato da questo run. Va
          # committato perché email.yml gira su un runner diverso e lo legge dal
          # repo per segnalare i portali fermi a zero da giorni.
          cp stato_portali.json /tmp/run_stato_portali.json 2>/dev/null || echo '{}' > /tmp/run_stato_portali.json

          for i in 1 2 3; do
            # Aggiorna al commit più recente del remoto (altri run potrebbero aver pushato)
            git fetch origin main
            git reset --hard origin/main

            # Merge intelligente: unisce i risultati di questo run con lo stato remoto.
            # load() distingue "file assente" (default legittimo) da "file presente ma
            # illeggibile/corrotto" (errore fatale, non un default silenzioso): un file
            # remoto corrotto non deve mai essere silenziosamente sostituito da uno vuoto.
            # La scrittura è atomica (temp file + rename) per non lasciare mai il file
            # troncato se il runner viene ucciso a metà (concurrency: cancel-in-progress).
            python3 - <<'EOF'
          import time
          # load()/atomic_write_json() vivono in state_io.py (nel checkout, zero
          # dipendenze esterne): stessa implementazione usata da scraper.py, invece
          # di duplicarla qui in un heredoc che può divergere silenziosamente.
          from state_io import load_json_or_raise as load, atomic_write_json

          remote_viste   = load('offerte_viste.json', {})
          remote_gior    = load('offerte_giornaliere.json', [])
          our_viste      = load('/tmp/run_viste.json', {})
          our_gior       = load('/tmp/run_gior.json', [])

          merged_viste = {**remote_viste, **our_viste}
          # Pulizia entry più vecchie di VISTE_MAX_AGE_DAYS (90, allineato a
          # scraper.py): senza questo, il merge fa solo un'unione di dict e la
          # pulizia applicata in load_viste() resta locale al singolo processo,
          # non arriva mai al file effettivamente committato, che cresce senza limiti.
          VISTE_MAX_AGE_DAYS = 90
          cutoff = time.time() - (VISTE_MAX_AGE_DAYS * 86400)
          merged_viste = {url: ts for url, ts in merged_viste.items() if ts > cutoff}

          existing_links = {j.get('link') for j in remote_gior}
          merged_gior = remote_gior + [j for j in our_gior if j.get('link') not in existing_links]

          atomic_write_json('offerte_viste.json', merged_viste, ensure_ascii=False, indent=2)
          atomic_write_json('offerte_giornaliere.json', merged_gior, ensure_ascii=False, indent=2)

          # stato_portali.json: si prende la versione di QUESTO run così com'è.
          # I contatori sono per-run e questo workflow ha concurrency di gruppo
          # "scraping", quindi non ci sono due run di scraping concorrenti da
          # fondere: l'ultimo che finisce ha lo stato più aggiornato.
          atomic_write_json('stato_portali.json', load('/tmp/run_stato_portali.json', {}), ensure_ascii=False, indent=2)

          print(f"Merge OK: {len(merged_viste)} URL visti, {len(merged_gior)} offerte oggi")
          EOF

            git add offerte_viste.json offerte_giornaliere.json stato_portali.json
            if git diff --staged --quiet; then
              echo "Nessuna modifica da salvare."
              exit 0
            fi
            git commit -m "chore: aggiorna stato scraper [skip ci]"
            if git push; then
              echo "Push riuscito al tentativo $i."
              exit 0
            fi
            echo "Push rifiutato (probabile push concorrente), tentativo $i/3: riprovo il merge..."
          done
          echo "Push fallito dopo 3 tentativi." >&2
          exit 1
