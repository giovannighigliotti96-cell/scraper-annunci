name: Scraping offerte

on:
  schedule:
    # GitHub Actions cron è sempre in UTC, ma l'Italia alterna CEST (UTC+2, marzo-ottobre)
    # e CET (UTC+1, ottobre-marzo). Per ogni orario italiano target ci sono quindi DUE
    # cron entry (una per stagione): lo step "Verifica orario" più sotto controlla l'ora
    # locale italiana reale ed esegue lo scraping solo se corrisponde a un orario target,
    # così esattamente una delle due invocazioni gira per davvero in ciascuna stagione.
    - cron: '17 7 * * *'   # 09:17 CEST (UTC+2, estate)
    - cron: '17 8 * * *'   # 09:17 CET (UTC+1, inverno)
    - cron: '17 10 * * *'  # 12:17 CEST
    - cron: '17 11 * * *'  # 12:17 CET
    - cron: '17 13 * * *'  # 15:17 CEST
    - cron: '17 14 * * *'  # 15:17 CET
    - cron: '30 15 * * *'  # 17:30 CEST
    - cron: '30 16 * * *'  # 17:30 CET
  workflow_dispatch:        # avvio manuale dalla UI GitHub

concurrency:
  group: scraping
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica orario italiano (gestisce cambio ora legale/solare)
        id: check_time
        run: |
          ORA_ITALIA=$(TZ='Europe/Rome' date +%H:%M)
          echo "Ora locale Italia: $ORA_ITALIA"
          SHOULD_RUN=false
          ORA_SEC=$(date -d "$ORA_ITALIA" +%s)
          for TARGET in "09:17" "12:17" "15:17" "17:30"; do
            TARGET_SEC=$(date -d "$TARGET" +%s)
            TARGET_END_SEC=$((TARGET_SEC + 900))
            if [ "$ORA_SEC" -ge "$TARGET_SEC" ] && [ "$ORA_SEC" -lt "$TARGET_END_SEC" ]; then
              SHOULD_RUN=true
            fi
          done
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHOULD_RUN=true
          fi
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "Esecuzione scraping: $SHOULD_RUN"

      - name: Checkout repo
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installa dipendenze
        if: steps.check_time.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Esegui scraping
        if: steps.check_time.outputs.should_run == 'true'
        env:
          # run_manual_scrape.py non invia mai email (solo run_email_job.py lo fa):
          # le credenziali Gmail non servono qui e non vanno esposte inutilmente
          # a questo step. ANTHROPIC_API_KEY invece serve, per il match LLM durante lo scraping stesso.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python run_manual_scrape.py

      - name: Salva memoria (commit JSON)
        if: steps.check_time.outputs.should_run == 'true'
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

          # Backup dei JSON prodotti da questo run. Per le offerte si usa il delta
          # nuove_offerte_run.json (solo quelle trovate in QUESTO run), non l'intero
          # offerte_giornaliere.json locale: quest'ultimo include anche offerte già
          # presenti prima del run, che un email.yml concorrente potrebbe aver già
          # rimosso dal remoto perché inviate — usarlo qui le "resusciterebbe".
          cp offerte_viste.json /tmp/run_viste.json
          cp nuove_offerte_run.json /tmp/run_gior.json

          for i in 1 2 3; do
            # Aggiorna al commit più recente del remoto (altri run potrebbero aver pushato)
            git fetch origin main
            git reset --hard origin/main

            # Merge intelligente: unisce i risultati di questo run con lo stato remoto.
            # load() distingue "file assente" (default legittimo) da "file presente ma
            # illeggibile/corrotto" (errore fatale, non un default silenzioso): un file
            # remoto corrotto non deve mai essere silenziosamente sostituito da uno vuoto.
            # La scrittura è atomica (temp file + rename) per non lasciare mai il file
            # troncato se il runner viene ucciso a metà (concurrency: cancel-in-progress).
            python3 - <<'EOF'
          import time
          # load()/atomic_write_json() vivono in state_io.py (nel checkout, zero
          # dipendenze esterne): stessa implementazione usata da scraper.py, invece
          # di duplicarla qui in un heredoc che può divergere silenziosamente.
          from state_io import load_json_or_raise as load, atomic_write_json

          remote_viste   = load('offerte_viste.json', {})
          remote_gior    = load('offerte_giornaliere.json', [])
          our_viste      = load('/tmp/run_viste.json', {})
          our_gior       = load('/tmp/run_gior.json', [])

          merged_viste = {**remote_viste, **our_viste}
          # Pulizia entry più vecchie di VISTE_MAX_AGE_DAYS (90, allineato a
          # scraper.py): senza questo, il merge fa solo un'unione di dict e la
          # pulizia applicata in load_viste() resta locale al singolo processo,
          # non arriva mai al file effettivamente committato, che cresce senza limiti.
          VISTE_MAX_AGE_DAYS = 90
          cutoff = time.time() - (VISTE_MAX_AGE_DAYS * 86400)
          merged_viste = {url: ts for url, ts in merged_viste.items() if ts > cutoff}

          existing_links = {j.get('link') for j in remote_gior}
          merged_gior = remote_gior + [j for j in our_gior if j.get('link') not in existing_links]

          atomic_write_json('offerte_viste.json', merged_viste, ensure_ascii=False, indent=2)
          atomic_write_json('offerte_giornaliere.json', merged_gior, ensure_ascii=False, indent=2)

          print(f"Merge OK: {len(merged_viste)} URL visti, {len(merged_gior)} offerte oggi")
          EOF

            git add offerte_viste.json offerte_giornaliere.json
            if git diff --staged --quiet; then
              echo "Nessuna modifica da salvare."
              exit 0
            fi
            git commit -m "chore: aggiorna stato scraper [skip ci]"
            if git push; then
              echo "Push riuscito al tentativo $i."
              exit 0
            fi
            echo "Push rifiutato (probabile push concorrente), tentativo $i/3: riprovo il merge..."
          done
          echo "Push fallito dopo 3 tentativi." >&2
          exit 1
